name: Docker Build and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建'
        required: false
        default: 'false'

# 同一分支仅保留最新一次构建
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: code-server
  DOCKERHUB_USERNAME: iflyelf
  HUAWEI_SWR_REGION: cn-east-3
  HUAWEI_SWR_USERNAME: cn-east-3@HPUAG3CQIK5OBPNSMCX4
  HUAWEI_SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com

jobs:
  # 获取最新版本号
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      update_readme: ${{ steps.check_version.outputs.update_readme }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest code-server version
        id: get_version
        run: |
          # 从 GitHub API 获取 code-server 最新版本
          LATEST_VERSION=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "最新版本: ${LATEST_VERSION}"
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          # 检查 Dockerfile 中的版本
          DOCKERFILE_VERSION=$(grep 'ARG CODE_SERVER_VERSION=' Dockerfile | head -1 | cut -d'=' -f2)
          echo "Dockerfile 版本: ${DOCKERFILE_VERSION}"
          echo "最新版本: ${CURRENT_VERSION}"
          
          if [ "${DOCKERFILE_VERSION}" != "${CURRENT_VERSION}" ]; then
            echo "版本已更新，需要更新 README"
            echo "update_readme=true" >> $GITHUB_OUTPUT
          else
            echo "版本未变化"
            echo "update_readme=false" >> $GITHUB_OUTPUT
          fi

  # 构建并推送镜像
  build:
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HUAWEI_SWR_REGISTRY }}
          username: ${{ env.HUAWEI_SWR_USERNAME }}
          password: ${{ secrets.HUAWEI_SWR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ env.HUAWEI_SWR_REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.get-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODE_SERVER_VERSION=${{ needs.get-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 更新 README
  update-readme:
    runs-on: ubuntu-latest
    needs: [get-version, build]
    if: needs.get-version.outputs.update_readme == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dockerfile version
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          sed -i "s/ARG CODE_SERVER_VERSION=.*/ARG CODE_SERVER_VERSION=${VERSION}/" Dockerfile
          
          # 检查是否有变化
          if git diff --quiet; then
            echo "没有变化需要提交"
            exit 0
          fi

      - name: Update README.md
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          
          # 更新版本号
          sed -i "s/code-server v[0-9.]\+/code-server v${VERSION}/" README.md || true
          sed -i "s/版本：v[0-9.]\+/版本：v${VERSION}/" README.md || true
          sed -i "s/最后更新：[0-9-]\+/最后更新：${DATE}/" README.md || true

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Dockerfile README.md
          git commit -m "chore: update code-server to v${{ needs.get-version.outputs.version }}" || exit 0
          git push
