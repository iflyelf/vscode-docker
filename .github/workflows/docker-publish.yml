name: 构建并发布 Docker 镜像

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建'
        required: false
        default: 'false'

# 同一分支仅保留最新一次构建：快速连续提交时自动取消旧构建
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# 权限配置
permissions:
  actions: write
  contents: write
  packages: write

env:
  镜像名称: code-server
  DOCKERHUB_用户名: iflyelf
  华为云_SWR_区域: cn-east-3
  华为云_SWR_用户名: cn-east-3@HPUAG3CQIK5OBPNSMCX4
  华为云_SWR_地址: swr.cn-east-3.myhuaweicloud.com

jobs:
  # 获取最新版本号
  获取版本号:
    name: 获取 code-server 最新版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      update_readme: ${{ steps.check_version.outputs.update_readme }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 code-server 最新版本
        id: get_version
        run: |
          # 从 GitHub API 获取 code-server 最新版本
          LATEST_VERSION=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "📌 最新版本: ${LATEST_VERSION}"
          echo "version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: 检查版本是否变化
        id: check_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          # 检查 Dockerfile 中的版本
          DOCKERFILE_VERSION=$(grep 'ARG CODE_SERVER_VERSION=' Dockerfile | head -1 | cut -d'=' -f2)
          echo "📦 Dockerfile 版本: ${DOCKERFILE_VERSION}"
          echo "🆕 最新版本: ${CURRENT_VERSION}"
          
          if [ "${DOCKERFILE_VERSION}" != "${CURRENT_VERSION}" ]; then
            echo "✅ 版本已更新，需要更新 README"
            echo "update_readme=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ 版本未变化"
            echo "update_readme=false" >> $GITHUB_OUTPUT
          fi

  # 构建并推送镜像
  构建镜像:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    needs: 获取版本号
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_用户名 }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录华为云 SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.华为云_SWR_地址 }}
          username: ${{ env.华为云_SWR_用户名 }}
          password: ${{ secrets.HUAWEI_SWR_PASSWORD }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}
            ${{ env.华为云_SWR_地址 }}/${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.获取版本号.outputs.version }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODE_SERVER_VERSION=${{ needs.获取版本号.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出构建信息
        run: |
          echo "✅ 镜像构建成功！"
          echo ""
          echo "📦 镜像标签:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/,/\n/g'
          echo ""
          echo "🔖 版本: ${{ needs.获取版本号.outputs.version }}"

  # 更新文档
  更新文档:
    name: 更新版本号到文档
    runs-on: ubuntu-latest
    needs: [获取版本号, 构建镜像]
    if: needs.获取版本号.outputs.update_readme == 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 Dockerfile 版本号
        run: |
          VERSION="${{ needs.获取版本号.outputs.version }}"
          echo "📝 更新 Dockerfile 版本号为: ${VERSION}"
          sed -i "s/ARG CODE_SERVER_VERSION=.*/ARG CODE_SERVER_VERSION=${VERSION}/" Dockerfile
          
          # 检查是否有变化
          if git diff --quiet; then
            echo "ℹ️ 没有变化需要提交"
            exit 0
          fi

      - name: 更新 README.md 版本号
        run: |
          VERSION="${{ needs.获取版本号.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          
          echo "📝 更新 README.md 版本号和日期"
          # 更新版本号
          sed -i "s/code-server 版本\*\*：v[0-9.]\+/code-server 版本**：v${VERSION}/" README.md || true
          sed -i "s/版本：v[0-9.]\+/版本：v${VERSION}/" README.md || true
          # 更新日期
          sed -i "s/最后更新\*\*：[0-9-]\+/最后更新**：${DATE}/" README.md || true
          sed -i "s/最后更新：[0-9-]\+/最后更新：${DATE}/" README.md || true

      - name: 提交变更
        run: |
          VERSION="${{ needs.获取版本号.outputs.version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Dockerfile README.md
          
          if git diff --staged --quiet; then
            echo "ℹ️ 没有变化需要提交"
            exit 0
          fi
          
          git commit -m "chore: 更新 code-server 版本到 v${VERSION}

- 自动更新 Dockerfile 版本号
- 自动更新 README.md 版本信息
- 由 GitHub Actions 自动提交" || exit 0
          
          git push
          echo "✅ 版本更新已提交"

  # 构建结果通知
  构建完成:
    name: 构建完成通知
    runs-on: ubuntu-latest
    needs: [获取版本号, 构建镜像]
    if: always()
    steps:
      - name: 输出构建结果
        run: |
          if [ "${{ needs.构建镜像.result }}" == "success" ]; then
            echo "🎉 构建成功！"
            echo ""
            echo "📦 镜像信息:"
            echo "  - Docker Hub: ${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}:latest"
            echo "  - Docker Hub: ${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}:${{ needs.获取版本号.outputs.version }}"
            echo "  - 华为云 SWR: ${{ env.华为云_SWR_地址 }}/${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}:latest"
            echo "  - 华为云 SWR: ${{ env.华为云_SWR_地址 }}/${{ env.DOCKERHUB_用户名 }}/${{ env.镜像名称 }}:${{ needs.获取版本号.outputs.version }}"
            echo ""
            echo "🔖 版本: ${{ needs.获取版本号.outputs.version }}"
            echo "📅 构建时间: $(date '+%Y-%m-%d %H:%M:%S')"
          else
            echo "❌ 构建失败！"
            echo "请查看构建日志了解详情。"
            exit 1
          fi

  # 清理旧的工作流运行记录
  清理旧构建:
    name: 清理旧的工作流运行记录
    runs-on: ubuntu-latest
    needs: [构建完成]
    if: always()
    steps:
      - name: 删除旧的 GitHub workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
