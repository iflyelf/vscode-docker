services:

  # 服务名
  code-server:
    # 模拟一个伪终端
    tty: true
    # 打开标准输入, 可以接受外部输入
    stdin_open: true
    # 指定容器名称
    container_name: code-server
    # 指定为镜像名称或镜像ID
    image: iflyelf/code-server:latest
    # 国内推荐改用华为云 SWR:
    # image: swr.cn-east-3.myhuaweicloud.com/iflyelf/code-server:latest
    # 覆盖容器启动后默认执行的命令
    # command: ["code-server", "--bind-addr", "0.0.0.0:8888", "--auth", "password"]
    # 使用 host 网络模式（直接使用宿主机网络）
    network_mode: "host"
    # 宿主机共享进程命名空间
    pid: host
    # 使用系统的 IPC 命名空间
    ipc: host
    # 允许容器中运行一些特权命令
    privileged: true
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 数据卷所挂载路径设置
    volumes:
      # code-server 配置文件目录
      - ./config:/root/.config/code-server
      # code-server 数据目录（扩展、用户设置等）
      - ./data:/root/.local/share/code-server
      # 工作区目录（可选，映射你的代码目录）
      - ./workspace:/workspace
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    # 环境变量
    environment:
      TZ: Asia/Shanghai
      # code-server 密码（也可以在 config.yaml 中配置）
      PASSWORD: ysyh!9Sky
      # 可选：设置默认工作目录
      # VSCODE_DEFAULT_WORKSPACE: /workspace
    # 注意：使用 host 网络模式时，ports 配置会被忽略
    # 容器将直接使用宿主机的 8888 端口
    # ports:
    #   - "8888:8888"
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
